[package]
name = "augur"
version = "0.12.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] } # HTTP Client
serde = { version = "1.0", features = ["derive"] } # Serialization
serde_json = "1.0" # JSON parsing
dotenv = "0.15" # Environment variables
hmac = "0.12" # Crypto for signing
sha2 = "0.10" # Crypto for signing
hex = "0.4" # Hex encoding
chrono = { version = "0.4", features = ["serde"] } # Time handling
base64 = "0.13"
tokio = { version = "1.50.0", features = ["full"] }
futures-util = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23.38", features = ["ring"] }
arrow = "58.1.0"
parquet = "58.1.0"
tempfile = "3.27.0"
csv = "1.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "augur"
path = "src/main.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[[example]]
name = "gen_synthetic"
path = "examples/gen_synthetic.rs"